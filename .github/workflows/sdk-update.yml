# Kazo OS SDK update (ADR 0271 §4 of Kazo OS): when Kazo OS releases a version, moves Kazo Word to
# it, runs the CI (with the JavaScript and end-to-end tests), and publishes the app automatically:
#   - a pre-release of Kazo OS: the beta branch, a beta version x.y.z-beta.n, the beta channel of
#     the Kazo OS Store;
#   - a stable minor or major release: a pull request to main, merged by the automation when the
#     CI is green, then tagged and published;
#   - a stable patch release: checked only (the pull request is closed once green).
# A red CI opens a TODO issue and changes nothing. Its commits start with "Kazo OS SDK". Only the
# Kazo OS submodule moves: WordCraft (external/wordcraft and its committed build) is moved by the
# Build WordCraft workflow. The steps live in the reusable workflow kazoos-sdk-update.yml of
# Kazo-ca/Os-AppTemplate (ADR 0271 §7).
#
# Started by Kazo OS (repository_dispatch kazoos-sdk-released with {version, channel}), every hour
# otherwise, or by hand from the Actions tab.
name: Kazo OS SDK update

on:
  repository_dispatch:
    types: [kazoos-sdk-released]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Kazo OS version to move to (empty for the newest release)
        required: false
        default: ''
      force:
        description: Redo a version already handled
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-sdk-update.yml@v1
    with:
      app-directory: src/Kazo.Word
      version: ${{ github.event.client_payload.version || inputs.version || '' }}
      force: ${{ inputs.force || false }}
      solution: Kazo.Word.slnx
      npm-test: true
      e2e-test: true
    secrets: inherit
