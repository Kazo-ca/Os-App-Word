# CI of Kazo Word: builds the Release profile (Kazo OS packages from nuget.org, at the version of
# the external/KazoOs submodule) and runs every test suite: C# unit tests, the iframe proxy and the
# OS-side module under node, and the end-to-end runs of the app inside the Kazo OS host
# (Playwright, Chromium). This is what the Kazo OS Store compiles.
# The steps live in the reusable workflow kazoos-ci.yml of Kazo-ca/Os-AppTemplate (ADR 0271 §7 of
# Kazo OS). It fetches only the Kazo OS submodule: external/wordcraft (WordCraft's sources) is only
# needed to compile WordCraft (build-wordcraft.yml); the tests use the build in wwwroot/wordcraft/.
# The Build WordCraft workflow calls the same reusable workflow on the branch it pushes, since a
# push made with the workflow token starts no workflow.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-ci.yml@v1
    with:
      solution: Kazo.Word.slnx
      npm-test: true
      e2e-test: true
