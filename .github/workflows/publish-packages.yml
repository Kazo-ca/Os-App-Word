# Publishes Kazo Word on the kazoos-packages branch of this repository for a tag v<version> (ADR
# 0182 §2, ADR 0219 §4 of Kazo OS), so that "kazopkg install Kazo-ca/Os-App-Word" installs it
# without the Kazo OS Store. Unsigned: apps are signed only in the marketplace repository (ADR
# 0219). The steps live in the reusable workflow kazoos-publish-packages.yml of
# Kazo-ca/Os-AppTemplate (ADR 0271 §7); it fetches only the Kazo OS submodule, not
# external/wordcraft (the build of WordCraft is committed under wwwroot/wordcraft/).
name: Publish the Kazo OS packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-publish-packages.yml@v1
    with:
      app-directory: src/Kazo.Word
