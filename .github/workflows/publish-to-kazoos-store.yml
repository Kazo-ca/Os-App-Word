# Submits a version of Kazo Word to the Kazo OS Store catalog for a tag v<version> (ADR 0188 §4, §7
# of Kazo OS): a stable version to its main branch, a beta version (0.1.2-beta.1) to its beta
# branch (ADR 0271 §5). The steps live in the reusable workflow kazoos-publish-to-store.yml of
# Kazo-ca/Os-AppTemplate (ADR 0271 §7). The pull request is opened with the Kazo OS automation app
# (organisation secrets KAZO_AUTOMATION_APP_ID and KAZO_AUTOMATION_APP_KEY) from a branch
# submit/<appId>_<version> of the catalog, or with the HACK_STORE_TOKEN secret from a fork; without
# either, the catalog folder stays as an artifact of the run. No signing key here: the catalog
# signs.
name: Publish to the Kazo OS Store

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-publish-to-store.yml@v1
    with:
      app-directory: src/Kazo.Word
    secrets: inherit
